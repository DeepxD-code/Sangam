# =============================================================
# SANGAM docker-compose.yml — Production Stack
# Usage: docker-compose --env-file .env up -d
# =============================================================

version: "3.9"

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sangam_db
    restart: unless-stopped

    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sangam}
      POSTGRES_USER:     ${POSTGRES_USER:-sangam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - sangam_data:/var/lib/postgresql/data

    # Health check: pg_isready before app starts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sangam_user} -d ${POSTGRES_DB:-sangam}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    ports:
      # Expose only to localhost for security (remove in fully private network)
      - "127.0.0.1:5432:5432"

  # ──────────────────────────────────────────────────────────
  # SANGAM Application
  # ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final

    container_name: sangam_app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV:              ${NODE_ENV:-production}
      PORT:                  ${PORT:-3000}

      # Constructed from DB service values
      DATABASE_URL:          postgresql://${POSTGRES_USER:-sangam_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sangam}

      # Secrets — MUST be set in .env file
      JWT_SECRET:            ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY:            ${JWT_EXPIRY:-8h}
      PASSWORD_PEPPER:       ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      AUDIT_ENCRYPTION_KEY:  ${AUDIT_ENCRYPTION_KEY:?AUDIT_ENCRYPTION_KEY is required}

      # Optional
      LOG_LEVEL:             ${LOG_LEVEL:-info}
      CORS_ORIGIN:           ${CORS_ORIGIN:-*}

    ports:
      - "${HOST_PORT:-3000}:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Limit resources to reflect typical field deployment hardware
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  sangam_data:
    driver: local

networks:
  default:
    name: sangam_network
